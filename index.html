<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<title>Lecture en mesure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one screen. Title and levels on top, the staff fills the middle,
   compact controls below, metronome dock at the bottom.
   Palette: cool print paper, deep ink, one brass accent (the saxophone). */
:root {
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  --bg: #EDF0F2;
  --surface: #F8F9FA;
  --ink: #16212B;
  --ink-2: #55646F;
  --line: #C9D2D9;
  --accent: #D3A23B;
  --on-accent: #1B1406;
  --accent-ink: #7A5707;
  --focus: #2B6CB0;
  --font-display: 'Bodoni Moda', 'Bodoni 72', Didot, Georgia, serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #16202A; --ink: #E6ECF0; --ink-2: #92A0AB; --line: #2A3844;
    --accent: #E2B24C; --on-accent: #1B1406; --accent-ink: #E2B24C; --focus: #8DBBF2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16202A; --ink: #E6ECF0; --ink-2: #92A0AB; --line: #2A3844;
  --accent: #E2B24C; --on-accent: #1B1406; --accent-ink: #E2B24C; --focus: #8DBBF2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  margin: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.4 var(--font-body);
}
button, select, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 8px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Title + levels */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; }
h1 {
  margin: 0;
  font: 700 1.25rem/1.1 var(--font-display);
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.lvl-line { margin: 0; color: var(--ink-2); font-size: 0.85rem; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lvl-desc { margin: 0; color: var(--ink-2); font-size: 0.85rem; display: none; }
.levels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.lv {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  height: 38px;
  padding: 0;
  font: 500 1.15rem/1 var(--font-display);
  cursor: pointer;
}
.lv:hover { border-color: var(--ink-2); }
.lv[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Sheet */
.sheet {
  flex: 1;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.staff { flex: 1; min-height: 0; position: relative; overflow: hidden; color: var(--ink); }
.staff svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.staff [fill="black"] { fill: currentColor; }
.staff [stroke="black"] { stroke: currentColor; }
.staff .nn { font-family: var(--font-body); font-weight: 600; fill: var(--ink-2); stroke: none; }
.err { color: var(--ink-2); padding: 24px 0; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.btn {
  appearance: none;
  background: transparent;
  border: 1px solid var(--ink);
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent-ink); margin: 0; }
.grp { display: inline-flex; align-items: center; gap: 6px; }
.lab { color: var(--ink-2); font-size: 0.78rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; min-width: 36px; height: 32px; padding: 0 10px; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:disabled { opacity: 0.35; cursor: default; }

/* Metronome dock */
.dock {
  flex: none;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
}
.dock-in {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 4px 12px;
  align-items: center;
}
.play {
  grid-row: span 2;
  appearance: none;
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: var(--on-accent);
  display: grid; place-items: center;
  cursor: pointer;
  transition: box-shadow 0.08s;
}
.play svg { width: 26px; height: 26px; }
.play .i-stop { display: none; }
.play[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.play[aria-pressed="true"] .i-play { display: none; }
.play[aria-pressed="true"] .i-stop { display: inline; }
.play.beat { box-shadow: 0 0 0 5px var(--accent); }

.tempo { display: flex; align-items: center; gap: 8px; min-width: 0; }
.step {
  appearance: none;
  width: 38px; height: 38px;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  user-select: none;
}
.step:hover { border-color: var(--ink); }
.bpm { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; min-width: 0; }
.bpm output {
  font: 700 1.9rem/1 var(--font-display);
  font-variant-numeric: tabular-nums lining-nums;
  min-width: 3ch;
  text-align: right;
}
.bpm .unit { color: var(--ink-2); font-size: 0.75rem; }
.chip {
  appearance: none;
  flex: none;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  height: 38px;
  padding: 0 12px;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
}
.chip:hover { border-color: var(--ink); }
.chip:active { background: var(--ink); color: var(--bg); }

.range-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.range-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent-ink); height: 24px; margin: 0; }
.mark { font: italic 500 1rem/1 var(--font-display); color: var(--accent-ink); min-width: 5.5em; text-align: right; }

@media (min-width: 700px) {
  .app { padding: 12px 20px 12px; gap: 10px; }
  .lvl-desc { display: block; }
  .lv { height: 42px; }
  h1 { font-size: 1.6rem; }
  .dock { padding-inline: 20px; }
}
@media (max-width: 380px) {
  .unit { display: none; }
  .play { width: 54px; height: 54px; }
}
@media (prefers-reduced-motion: no-preference) {
  .lv, .btn, .chip, .step { transition: background-color 0.12s, color 0.12s, border-color 0.12s; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Lecture en mesure</h1>
    <p id="lvlLine" class="lvl-line"></p>
  </header>

  <div id="levels" class="levels" role="group" aria-label="Niveau"></div>
  <p id="lvlDesc" class="lvl-desc"></p>

  <section class="sheet" aria-label="Exercice">
    <div id="staff" class="staff"></div>
    <div class="controls">
      <button id="newBtn" class="btn" type="button">Nouvel exercice</button>
      <label class="switch" for="namesToggle"><input id="namesToggle" type="checkbox"> Noms</label>
      <div class="grp">
        <span id="npbLabel" class="lab">Par temps</span>
        <div id="npb" class="seg" role="group" aria-labelledby="npbLabel"></div>
      </div>
      <div class="grp">
        <span id="sizeLabel" class="lab">Taille</span>
        <div class="seg" role="group" aria-labelledby="sizeLabel">
          <button id="smaller" type="button" aria-label="Notes plus petites, plus de notes">A−</button>
          <button id="bigger" type="button" aria-label="Notes plus grandes">A+</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="dock" role="region" aria-label="Métronome">
  <div class="dock-in">
    <button id="play" class="play" type="button" aria-pressed="false" aria-label="Lancer le métronome">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="i-play" d="M8 5.2v13.6L19.2 12z" fill="currentColor"/>
        <rect class="i-stop" x="6.5" y="6.5" width="11" height="11" rx="1.2" fill="currentColor"/>
      </svg>
    </button>

    <div class="tempo">
      <button id="minus" class="step" type="button" aria-label="Ralentir">−</button>
      <div class="bpm">
        <output id="bpmOut" for="bpmRange">80</output>
        <span class="unit">♩ par minute</span>
      </div>
      <button id="plus" class="step" type="button" aria-label="Accélérer">+</button>
      <button id="tap" class="chip" type="button">Tap</button>
    </div>

    <div class="range-row">
      <input id="bpmRange" type="range" min="30" max="220" step="1" value="80" aria-label="Tempo en battements par minute">
      <span id="mark" class="mark">Andante</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- Progression (clé de sol, d'après la méthode Dandelot) ---------- */
  var LETTERS = ['c', 'd', 'e', 'f', 'g', 'a', 'b'];
  var FR = ['Do', 'Ré', 'Mi', 'Fa', 'Sol', 'La', 'Si'];

  /* Une hauteur est un degré diatonique : octave * 7 + lettre (Do4 = 28). */
  function span(a, b) { var o = []; for (var i = a; i <= b; i++) o.push(i); return o; }
  var REPERES = [28, 32, 35, 39];                       /* Do4 Sol4 Do5 Sol5 */
  var VOISINES = [27, 28, 29, 31, 32, 33, 34, 35, 36, 38, 39, 40];

  var LEVELS = [
    { name: 'Les repères', ex: 'ex. 1–2', desc: 'Do, Sol, Do, Sol : les quatre points de repère',
      pool: REPERES },
    { name: 'Les voisines', ex: 'ex. 3–4', desc: 'La note juste au-dessus ou au-dessous de chaque repère. Repères en blanches',
      pool: VOISINES, mark: true },
    { name: 'Repères effacés', ex: 'ex. 5–8', desc: 'Mêmes notes, tout en noires : on retrouve les repères de tête',
      pool: VOISINES },
    { name: 'Les tierces', ex: 'ex. 9–10', desc: 'Toute la portée, de La grave à Si aigu. Repères en blanches',
      pool: span(26, 41), mark: true },
    { name: 'Toute la portée', ex: 'ex. 11–12', desc: 'La grave à Si aigu, sans aucun repère marqué',
      pool: span(26, 41) },
    { name: 'Lignes supplémentaires', ex: 'ex. 13–15', desc: 'Au-dessus et au-dessous de la portée, avec un nouveau repère : le Do aigu',
      pool: span(26, 44), ledger: true },
    { name: 'Octaves', ex: 'ex. 25–28', desc: "Reconnaître l'octave d'un seul coup d'œil",
      pool: span(26, 44), octave: true }
  ];
  var SPEEDS = [
    { n: 1, cap: 'noires' },
    { n: 2, cap: 'croches' },
    { n: 3, cap: 'triolets de croches' },
    { n: 4, cap: 'doubles-croches' }
  ];
  var SCALES = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.15, 1.3];
  var STREAM = 600;   /* notes générées d'avance ; l'écran en affiche autant qu'il peut */

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function weight(prev, cand, L, same, tight) {
    var dd = Math.abs(cand - prev);
    if (dd === 0) return same >= 1 ? 0 : 0.15;
    if (tight && dd > 2) return 0;
    var w = dd === 1 ? 3 : dd === 2 ? 4 : dd === 3 ? 2 : dd === 4 ? 1.5 : dd === 7 ? (L.octave ? 7 : 0.8) : 0.7;
    if (L.ledger && (cand >= 40 || cand <= 28)) w *= 2;
    return w;
  }
  function generate(li, npb, count) {
    var L = LEVELS[li], pool = L.pool, n = count || STREAM, notes = [], same = 0, prev = null, i, k;
    for (i = 0; i < n; i++) {
      var d;
      if (prev === null) {
        d = pool[Math.floor(Math.random() * pool.length)];
      } else {
        var ws = [], tot = 0, tight = npb > 1 && i % npb !== 0;
        for (k = 0; k < pool.length; k++) { var w = weight(prev, pool[k], L, same, tight); ws.push(w); tot += w; }
        if (!tot) {
          for (k = 0; k < pool.length; k++) { ws[k] = weight(prev, pool[k], L, same, false); tot += ws[k]; }
        }
        var r = Math.random() * tot;
        d = pool[pool.length - 1];
        for (k = 0; k < pool.length; k++) { r -= ws[k]; if (r < 0) { d = pool[k]; break; } }
      }
      same = d === prev ? same + 1 : 0;
      prev = d;
      notes.push({ deg: d, name: FR[d % 7], rep: !!L.mark && npb === 1 && REPERES.indexOf(d) !== -1 });
    }
    return { level: li, npb: npb, notes: notes };
  }

  /* ---------- État ---------- */
  var state = { bpm: 80, level: 0, npb: 1, names: false, scale: 0.7 };
  try {
    var saved = JSON.parse(localStorage.getItem('lecture-en-mesure-v3') || '{}');
    if (saved.bpm) state.bpm = clamp(Math.round(+saved.bpm) || 80, 30, 220);
    if (typeof saved.level === 'number' && saved.level >= 0 && saved.level < LEVELS.length) state.level = saved.level;
    if (saved.npb >= 1 && saved.npb <= 4) state.npb = Math.round(saved.npb);
    if (SCALES.indexOf(saved.scale) !== -1) state.scale = saved.scale;
    state.names = !!saved.names;
  } catch (e) {}
  function save() { try { localStorage.setItem('lecture-en-mesure-v3', JSON.stringify(state)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var staffEl = $('staff'), levelsEl = $('levels'), lvlLine = $('lvlLine'), lvlDesc = $('lvlDesc');
  var ex = null;

  /* ---------- Notation ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  var ROW_PLAIN = 126, ROW_NAMES = 150, CLEF_W = 46, PAD = 4;
  var NOTE_W = { 1: 34, 2: 30, 3: 30, 4: 26 };

  function drawExercise() {
    staffEl.innerHTML = '';
    if (!ex) return;
    if (!window.Vex || !window.Vex.Flow) {
      staffEl.innerHTML = '<p class="err">La bibliothèque de notation n\'a pas pu se charger. Vérifie ta connexion puis recharge la page.</p>';
      return;
    }
    var VF = window.Vex.Flow;
    var npb = ex.npb, s = state.scale;
    var W = staffEl.clientWidth || 360, Hav = staffEl.clientHeight || 420;
    var Wn = W / s, Hn = Hav / s;
    var rh0 = state.names ? ROW_NAMES : ROW_PLAIN;
    var rows = Math.max(1, Math.floor(Hn / rh0));
    var RH = Hn / rows;
    var per = Math.floor((Wn - 2 * PAD - CLEF_W) / NOTE_W[npb]);
    per = Math.max(npb, per - per % npb);
    var total = Math.min(rows * per, ex.notes.length);

    var renderer = new VF.Renderer(staffEl, VF.Renderer.Backends.SVG);
    renderer.resize(Wn, Hn);
    var ctx = renderer.getContext();
    ctx.setFillStyle('currentColor');
    ctx.setStrokeStyle('currentColor');
    var svg = staffEl.querySelector('svg');
    svg.setAttribute('viewBox', '0 0 ' + Wn + ' ' + Hn);
    svg.style.width = '100%';   /* VexFlow impose une taille en pixels : on la remplace pour que le dessin se mette à l'échelle */
    svg.style.height = '100%';
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Exercice de lecture de notes en clé de sol');
    var nameSize = clamp(11 / s, 12, 20);

    for (var ri = 0; ri < rows; ri++) {
      var row = ex.notes.slice(ri * per, Math.min((ri + 1) * per, total));
      if (!row.length) break;
      var y = ri * RH + (RH - rh0) / 2 + 8;
      var stave = new VF.Stave(PAD, y, Wn - 2 * PAD);
      stave.addClef('treble');
      if (ri === rows - 1 || (ri + 1) * per >= total) stave.setEndBarType(VF.Barline.type.END);
      stave.setContext(ctx).draw();

      /* One stem direction per beamed group: down when the group sits above the middle line. */
      var dirs = [];
      if (npb > 1) {
        for (var q = 0; q < row.length; q += npb) {
          var far = 0;
          for (var u = 0; u < npb; u++) {
            var off = row[q + u].deg - 34;
            if (Math.abs(off) > Math.abs(far)) far = off;
          }
          dirs.push(far >= 0 ? -1 : 1);
        }
      }
      var notes = row.map(function (n, idx) {
        var o = {
          clef: 'treble',
          keys: [LETTERS[n.deg % 7] + '/' + Math.floor(n.deg / 7)],
          duration: npb === 1 ? (n.rep ? 'h' : 'q') : npb === 4 ? '16' : '8'
        };
        if (npb === 1) o.auto_stem = true; else o.stem_direction = dirs[Math.floor(idx / npb)];
        return new VF.StaveNote(o);
      });

      var beams = [], tuplets = [];
      if (npb > 1) {
        for (var g = 0; g + npb <= notes.length; g += npb) {
          var grp = notes.slice(g, g + npb), dir = dirs[g / npb];
          if (npb === 3) tuplets.push(new VF.Tuplet(grp, { num_notes: 3, notes_occupied: 2, location: dir === 1 ? 1 : -1 }));
          beams.push(new VF.Beam(grp));
        }
      }
      VF.Formatter.FormatAndDraw(ctx, stave, notes);
      beams.forEach(function (b) { b.setContext(ctx).draw(); });
      tuplets.forEach(function (t) { t.setContext(ctx).draw(); });

      if (state.names) {
        notes.forEach(function (sn, k) {
          var cx;
          try { cx = (sn.getNoteHeadBeginX() + sn.getNoteHeadEndX()) / 2; } catch (e) { cx = sn.getAbsoluteX() + 6; }
          var t = document.createElementNS(NS, 'text');
          t.setAttribute('x', cx);
          t.setAttribute('y', y + 128);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('class', 'nn');
          t.setAttribute('font-size', nameSize);
          t.textContent = row[k].name;
          svg.appendChild(t);
        });
      }
    }
  }

  function newExercise() {
    ex = generate(state.level, state.npb);
    drawExercise();
  }

  /* ---------- Niveaux, vitesse, taille ---------- */
  function renderLevels() {
    Array.prototype.forEach.call(levelsEl.children, function (b, i) {
      b.setAttribute('aria-pressed', i === state.level ? 'true' : 'false');
    });
    var L = LEVELS[state.level];
    lvlLine.textContent = 'Niveau ' + (state.level + 1) + ' · ' + L.name;
    lvlDesc.textContent = L.desc + ' (' + L.ex + ')';
  }
  LEVELS.forEach(function (L, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'lv';
    b.textContent = String(i + 1);
    b.setAttribute('aria-label', 'Niveau ' + (i + 1) + ', ' + L.name);
    b.addEventListener('click', function () { state.level = i; save(); renderLevels(); newExercise(); });
    levelsEl.appendChild(b);
  });

  var npbEl = $('npb');
  function renderSpeed() {
    Array.prototype.forEach.call(npbEl.children, function (b, i) {
      b.setAttribute('aria-pressed', SPEEDS[i].n === state.npb ? 'true' : 'false');
    });
  }
  SPEEDS.forEach(function (S) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(S.n);
    b.setAttribute('aria-label', S.n + ' par temps, ' + S.cap);
    b.title = S.cap;
    b.addEventListener('click', function () { state.npb = S.n; save(); renderSpeed(); newExercise(); });
    npbEl.appendChild(b);
  });

  var smallerBtn = $('smaller'), biggerBtn = $('bigger');
  function renderSize() {
    var i = SCALES.indexOf(state.scale);
    smallerBtn.disabled = i <= 0;
    biggerBtn.disabled = i >= SCALES.length - 1;
  }
  function stepSize(d) {
    var i = clamp(SCALES.indexOf(state.scale) + d, 0, SCALES.length - 1);
    state.scale = SCALES[i];
    save(); renderSize(); drawExercise();
  }
  smallerBtn.addEventListener('click', function () { stepSize(-1); });
  biggerBtn.addEventListener('click', function () { stepSize(1); });

  /* ---------- Métronome ---------- */
  var M = { ctx: null, running: false, next: 0, timer: null, queue: [] };
  var playBtn = $('play'), bpmOut = $('bpmOut'), bpmRange = $('bpmRange'), markEl = $('mark');
  var flashT = null, keepAlive = null;

  function tempoMark(b) {
    return b < 60 ? 'Largo' : b < 76 ? 'Adagio' : b < 108 ? 'Andante' : b < 120 ? 'Moderato' :
           b < 156 ? 'Allegro' : b < 176 ? 'Vivace' : 'Presto';
  }
  function setBpm(v) {
    state.bpm = clamp(Math.round(v), 30, 220);
    bpmOut.textContent = state.bpm;
    bpmRange.value = state.bpm;
    markEl.textContent = tempoMark(state.bpm);
    save();
  }
  function flash() {
    playBtn.classList.add('beat');
    clearTimeout(flashT);
    flashT = setTimeout(function () { playBtn.classList.remove('beat'); }, 90);
  }

  /* iPhone : sans cela, le mode silencieux coupe le son de Web Audio. */
  function unlockAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {
      if (!keepAlive) {
        var n = 8000, buf = new ArrayBuffer(44 + n), v = new DataView(buf), i;
        var tag = function (o, t) { for (var j = 0; j < t.length; j++) v.setUint8(o + j, t.charCodeAt(j)); };
        tag(0, 'RIFF'); v.setUint32(4, 36 + n, true); tag(8, 'WAVE'); tag(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
        tag(36, 'data'); v.setUint32(40, n, true);
        for (i = 0; i < n; i++) v.setUint8(44 + i, 128);
        keepAlive = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
        keepAlive.loop = true;
        keepAlive.setAttribute('playsinline', '');
      }
      var p = keepAlive.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function click(time) {
    var ac = M.ctx;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = 1320;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.8, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);
    o.connect(g); g.connect(ac.destination);
    o.start(time); o.stop(time + 0.09);
  }
  function schedule() {
    var ahead = document.hidden ? 1.5 : 0.12;
    while (M.next < M.ctx.currentTime + ahead) {
      click(M.next);
      M.queue.push(M.next);
      M.next += 60 / state.bpm;
    }
  }
  function frame() {
    if (!M.running) return;
    var now = M.ctx.currentTime, hit = false;
    while (M.queue.length && M.queue[0] <= now) { M.queue.shift(); hit = true; }
    if (hit) flash();
    requestAnimationFrame(frame);
  }
  function startMetro() {
    unlockAudio();
    if (!M.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      M.ctx = new AC();
    }
    M.running = true;
    M.queue = [];
    playBtn.setAttribute('aria-pressed', 'true');
    playBtn.setAttribute('aria-label', 'Arrêter le métronome');
    var begin = function () {
      if (!M.running || M.timer) return;
      M.next = M.ctx.currentTime + 0.06;
      schedule();
      M.timer = setInterval(schedule, 25);
      requestAnimationFrame(frame);
    };
    var p = M.ctx.resume();
    if (p && p.then) p.then(begin, begin); else begin();
  }
  function stopMetro() {
    M.running = false;
    clearInterval(M.timer);
    M.timer = null;
    M.queue = [];
    playBtn.classList.remove('beat');
    if (keepAlive) keepAlive.pause();
    playBtn.setAttribute('aria-pressed', 'false');
    playBtn.setAttribute('aria-label', 'Lancer le métronome');
  }
  function toggleMetro() { if (M.running) stopMetro(); else startMetro(); }

  playBtn.addEventListener('click', toggleMetro);
  bpmRange.addEventListener('input', function () { setBpm(+bpmRange.value); });

  function bindHold(btn, delta) {
    var t1 = null, t2 = null;
    function stop() { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      stop();
      setBpm(state.bpm + delta);
      t1 = setTimeout(function () { t2 = setInterval(function () { setBpm(state.bpm + delta); }, 70); }, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { btn.addEventListener(ev, stop); });
    btn.addEventListener('click', function (e) { if (e.detail === 0) setBpm(state.bpm + delta); });
  }
  bindHold($('minus'), -1);
  bindHold($('plus'), 1);

  var taps = [];
  $('tap').addEventListener('click', function () {
    var t = performance.now();
    if (taps.length && t - taps[taps.length - 1] > 2000) taps = [];
    taps.push(t);
    if (taps.length > 6) taps.shift();
    if (taps.length >= 2) setBpm(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
  });

  /* ---------- Branchement ---------- */
  $('newBtn').addEventListener('click', newExercise);
  var namesToggle = $('namesToggle');
  namesToggle.checked = state.names;
  namesToggle.addEventListener('change', function () { state.names = namesToggle.checked; save(); drawExercise(); });

  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); toggleMetro(); }
    else if ((e.key === 'n' || e.key === 'N') && tag !== 'BUTTON') newExercise();
    else if (e.key === 'ArrowUp') { e.preventDefault(); setBpm(state.bpm + (e.shiftKey ? 5 : 1)); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setBpm(state.bpm - (e.shiftKey ? 5 : 1)); }
  });

  var lastW = 0, lastH = 0, rt = null;
  function watchSize() {
    var w = Math.floor(staffEl.clientWidth), h = Math.floor(staffEl.clientHeight);
    if ((w !== lastW || h !== lastH) && w && h) {
      lastW = w; lastH = h;
      clearTimeout(rt);
      rt = setTimeout(drawExercise, 60);
    }
  }
  if (window.ResizeObserver) new ResizeObserver(watchSize).observe(staffEl);
  else window.addEventListener('resize', watchSize);

  setBpm(state.bpm);
  renderLevels();
  renderSpeed();
  renderSize();
  newExercise();
  lastW = Math.floor(staffEl.clientWidth);
  lastH = Math.floor(staffEl.clientHeight);

  window.LEM = { generate: generate, LEVELS: LEVELS };
})();
</script>
</body>
